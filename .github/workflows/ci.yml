name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (GCC, ASan + UBSan)
            os: ubuntu-latest
            sanitize: ON
          - name: macOS (Clang, ASan + UBSan)
            os: macos-latest
            sanitize: ON
          - name: Windows (MSVC)
            os: windows-latest
            sanitize: OFF
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DPICKS_SANITIZE=${{ matrix.sanitize }} -DPICKS_WERROR=ON
      - name: Build
        run: cmake --build build --config Debug --parallel
      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure

  backtest:
    name: Backtest
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (Release)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPICKS_BUILD_TESTS=OFF
          cmake --build build --parallel
      - name: Run
        run: |
          ./build/picks-model backtest --history history --json backtest.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: backtest
          path: backtest.json
