name: Update history

on:
  schedule:
    - cron: "30 6 * * *"  # daily, after the night's games have finished
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-history
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch finished games
        run: node tools/backfill.mjs --incremental
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898810+github-actions[bot]@users.noreply.github.com"
          git add history config/espn_leagues.json
          if git diff --cached --quiet; then
            echo "No new games."
          else
            git commit -m "chore: update history"
            git pull --rebase
            git push
          fi
